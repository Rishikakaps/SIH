services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ocr_models:/app/backend/.ocr-models
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      GROQ_SPEECH_MODEL: ${GROQ_SPEECH_MODEL:-whisper-large-v3}
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  ocr_models:
