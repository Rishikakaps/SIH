services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rxlens
      POSTGRES_USER: rxlens
      POSTGRES_PASSWORD: rxlens
    ports:
      - "5432:5432"
    volumes:
      - ../backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://rxlens:rxlens@postgres:5432/rxlens
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
